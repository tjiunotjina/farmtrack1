<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Orutumbo admin</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<style>
:root{--forest:#3F5232;--parch:#EFE9DA;--bone:#F8F5EC;--ink:#26281F;--muted:#5B5744;--line:#D3CAB1;--rust:#9C3B2E;--ochre:#C9962F}
*{box-sizing:border-box}
body{margin:0;background:var(--parch);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--forest);color:#fff;padding:12px 20px}
main{max-width:1200px;margin:0 auto;padding:20px}
button,input,select{font:inherit}
button{cursor:pointer;border:1.5px solid var(--forest);background:var(--forest);color:#fff;border-radius:6px;padding:6px 12px}
button.ghost{background:transparent;color:var(--forest)}
button.danger{background:transparent;color:var(--rust);border-color:var(--rust)}
input,select{padding:7px 9px;border:1.5px solid #A79F85;border-radius:6px;background:#fff;width:100%}
label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
#login{max-width:340px;margin:60px auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--bone);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile small{display:block;color:var(--muted)}.tile b{font-size:22px}.tile span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--forest)}.tabs button[aria-pressed="true"]{background:var(--forest);color:#fff}
.panel{background:var(--bone);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px;align-items:end}
.panel h3{grid-column:1/-1;margin:0 0 8px}
.wide{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--bone);border:1px solid var(--line)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{background:#E6DFCB;font-size:12px}
td.num,th.num{text-align:right;white-space:nowrap}
.chip{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600;color:#fff;background:var(--muted)}
.chip.paid,.chip.active,.chip.sent,.chip.logged{background:var(--forest)}.chip.open,.chip.trialing{background:var(--ochre);color:var(--ink)}
.chip.failed,.chip.expired,.chip.past_due{background:var(--rust)}
.msg{min-height:1.4em;margin:0 0 10px;font-weight:600}.msg.err{color:var(--rust)}
.actions{white-space:nowrap}.actions button{font-size:12px;padding:3px 8px;margin-right:4px}
</style>
</head>
<body>
<header class="bar"><strong>Orutumbo admin</strong><button id="logout" class="ghost" style="color:#fff;border-color:#fff" hidden>Sign out</button></header>
<main>
  <section id="login">
    <form id="login-form">
      <h2>Sign in</h2>
      <label>Admin secret <input id="secret" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <p class="msg err" id="login-msg" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="tiles" id="tiles"></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="customers" aria-pressed="true">Customers</button>
      <button data-tab="invoices" aria-pressed="false">Invoices</button>
      <button data-tab="payments" aria-pressed="false">Payments</button>
      <button data-tab="emails" aria-pressed="false">Emails</button>
      <button id="new-invoice-btn" class="ghost">New invoice</button>
    </nav>
    <p class="msg" id="msg" role="status"></p>

    <form class="panel" id="invoice-form" hidden>
      <h3>New invoice</h3>
      <label>Customer number <input id="inv-customer" placeholder="ORU-000001" required></label>
      <label>Plan <select id="inv-plan"><option value="">Custom (no plan)</option></select></label>
      <label>Billing <select id="inv-cycle"><option value="monthly">Monthly</option><option value="annual">Annual</option></select></label>
      <label>Amount (N$) <input id="inv-amount" type="number" step="0.01" min="0" placeholder="From the plan"></label>
      <label>Description <input id="inv-desc" placeholder="Required for a custom invoice"></label>
      <label>Due in (days) <input id="inv-due" type="number" min="0" max="90" value="7"></label>
      <div><button type="submit">Create and email invoice</button> <button type="button" class="ghost" data-close>Cancel</button></div>
    </form>

    <form class="panel" id="payment-form" hidden>
      <h3 id="pay-title">Record payment</h3>
      <input type="hidden" id="pay-id">
      <label>Amount received (N$) <input id="pay-amount" type="number" step="0.01" min="0" required></label>
      <label>Method <select id="pay-method"><option value="eft">EFT</option><option value="cash">Cash</option><option value="card">Card</option><option value="other">Other</option></select></label>
      <label>Bank reference <input id="pay-ref" maxlength="100"></label>
      <label>Date received <input id="pay-date" type="date" required></label>
      <div><button type="submit">Record payment</button> <button type="button" class="ghost" data-close>Cancel</button></div>
    </form>

    <div class="wide" id="view"></div>
  </section>
</main>
<script src="../config.js"></script>
<script src="admin.js"></script>
</body>
</html>
